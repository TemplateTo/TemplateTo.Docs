site_name: TemplateTo Documentation
extra:
  generator: false
  social:
    - icon: fontawesome/solid/house 
      link: https://templateto.com
    - icon: fontawesome/brands/x-twitter 
      link: https://twitter.com/gettemplateto
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCJ0RMNRtTIm7CugDmNcdHdQ
extra_css:
  - stylesheets/extra.css
  
copyright: Copyright &copy; TemplateTo 2024

plugins:
   - search
   - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

theme:
  name: material
  favicon: assets/favicon.ico
  logo: assets/logo_icon_grey.png
  icon:
    annotation: material/star-four-points-circle
  palette:
    primary: custom
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Quick Start:
    - 5-Minute Tutorial: getting-started/getting-started-in-5-mins.md
    - Sign Up: getting-started/index.md
  - User Guide:
    - Editor Overview: getting-started/editor-overview.md
    - Templates:
      - Creating Your First Template: getting-started/create-first-template.md
      - Template Settings: getting-started/template-settings.md
      - Template Themes: getting-started/template-themes.md
    - Working with Content:
      - Elements: getting-started/elements.md
      - Data & Variables: getting-started/working-with-variables.md
    - Account Management:
      - Managing Users: getting-started/adding-users.md
  - Integrations:
    - Overview: integrations/index.md
    - API Key Management: getting-started/api-key-management.md
    - REST API: integrations/restAPI.md
    - Async Rendering: integrations/async-rendering.md
    - Zapier: integrations/zapier.md
    - N8N: integrations/n8n.md