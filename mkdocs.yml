site_name: TemplateTo Documentation
extra:
  generator: false
  social:
    - icon: fontawesome/solid/house
      link: https://templateto.com
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/gettemplateto
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCJ0RMNRtTIm7CugDmNcdHdQ
extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; TemplateTo 2024

plugins:
   - search
   - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

theme:
  name: material
  favicon: assets/favicon.ico
  logo: assets/logo-dark.png
  icon:
    annotation: material/star-four-points-circle
  palette:
    primary: custom
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Quick Start Guide: getting-started/getting-started-in-5-mins.md
    - How Templates Work: getting-started/how-templates-work.md
  - Template Builder Guide:
    - template-guide/index.md
    - Editor Overview: template-guide/editor-overview.md
    - Creating Templates:
      - template-guide/creating/index.md
      - Your First Template: template-guide/creating/first-template.md
      - Elements Reference: template-guide/creating/elements.md
      - Code Block: template-guide/creating/code-block.md
      - Template Settings: template-guide/creating/settings.md
    - Dynamic Content:
      - template-guide/dynamic-content/index.md
      - Variables & Data: template-guide/dynamic-content/variables.md
      - Data Binding: template-guide/dynamic-content/data-binding.md
      - Liquid Reference: template-guide/dynamic-content/liquid-reference.md
      - Filters & Tags: template-guide/dynamic-content/filters-tags.md
      - Functions:
        - template-guide/dynamic-content/functions/index.md
        - repeat(): template-guide/dynamic-content/functions/repeat.md
        - Content Blocks: template-guide/dynamic-content/functions/content-blocks.md
        - QR Codes & Barcodes: template-guide/dynamic-content/functions/qr-codes-barcodes.md
        - Utilities: template-guide/dynamic-content/functions/utilities.md
      - Page Placeholders: template-guide/dynamic-content/page-placeholders.md
      - Localization: template-guide/dynamic-content/localization.md
      - Debugging: template-guide/dynamic-content/debugging.md
      - Themes: template-guide/dynamic-content/themes.md
      - Recipes:
        - template-guide/dynamic-content/recipes/index.md
        - Invoice Template: template-guide/dynamic-content/recipes/invoice-template.md
        - Iteration Patterns: template-guide/dynamic-content/recipes/iteration-patterns.md
        - Conditional Content: template-guide/dynamic-content/recipes/conditional-content.md
    - Scheduled Publishing: template-guide/scheduled-publishing.md
    - Output Formats:
      - template-guide/output-formats/index.md
      - PDF Generation: template-guide/output-formats/pdf.md
      - Image Generation: template-guide/output-formats/images.md
      - Plain Text: template-guide/output-formats/txt.md
  - Developer Guide:
    - developer-guide/index.md
    - Authentication: developer-guide/authentication.md
    - REST API Reference: developer-guide/rest-api.md
    - Async Rendering: developer-guide/async-rendering.md
    - No-Code Integrations:
      - developer-guide/no-code/index.md
      - Zapier: developer-guide/no-code/zapier.md
      - N8N: developer-guide/no-code/n8n.md
      - Odoo: developer-guide/no-code/odoo.md
  - Account & Settings:
    - account/index.md
    - Managing Users: account/users.md
    - API Keys: account/api-keys.md
